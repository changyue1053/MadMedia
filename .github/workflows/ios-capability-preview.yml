name: iOS isolated capability preview
on:
  push:
    branches: [checkpoint/madmedia-ios-capability-preview]
permissions:
  contents: read
jobs:
  ios-arm64:
    if: github.ref == 'refs/heads/checkpoint/madmedia-ios-capability-preview'
    runs-on: macos-15
    timeout-minutes: 24
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact source checkpoint
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate project and exact test-result gates
        run: python3 apple-capability-preview/ios/test_check.py
      - name: Build unsigned device App and run actual ARM64 simulator XCTest
        run: python3 apple-capability-preview/ios/check.py

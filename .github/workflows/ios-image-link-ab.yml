name: iOS image installed archive compile-only link matrix
on:
  push:
    branches: [checkpoint/madmedia-ios-image-link-ab]
permissions:
  contents: read
jobs:
  ios-image-link-ab:
    if: github.ref == 'refs/heads/checkpoint/madmedia-ios-image-link-ab'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Confirm clean exact source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git status --porcelain)"
      - name: Check structural and matrix contracts
        run: python3 ios-image-link-ab/test_check.py
      - name: Compare installed archive linkage without Simulator boot
        run: python3 ios-image-link-ab/check.py

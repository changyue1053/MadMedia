name: Installed multi-app package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  package:
    # This exact push has its own stock-only, no-task installed ownership gate.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/checkpoint/madmedia-installed-ownership' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        obs: ["OFF", "ON"]
        direction: [gcc-to-clang, clang-to-gcc]
        include:
          - direction: gcc-to-clang
            producer_c: gcc-13
            producer_cxx: g++-13
            consumer_c: clang-18
            consumer_cxx: clang++-18
          - direction: clang-to-gcc
            producer_c: clang-18
            producer_cxx: clang++-18
            consumer_c: gcc-13
            consumer_cxx: g++-13
    steps:
      - uses: actions/checkout@v4
      - name: Pinned optional observer contract
        if: matrix.obs == 'ON'
        uses: actions/checkout@v4
        with:
          repository: changyue1053/MadObs
          ref: e3320ed5fc3ea03171dd5dab8231a8e7f569a983
          path: .dependencies/MadObs
      - name: Toolchains and dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc-13 g++-13 clang-18 libcurl4-openssl-dev libsqlite3-dev python3
      - name: Relocate and consume in two apps
        run: |
          python3 scripts/verify_package.py \
            --producer-c '${{ matrix.producer_c }}' --producer-cxx '${{ matrix.producer_cxx }}' \
            --consumer-c '${{ matrix.consumer_c }}' --consumer-cxx '${{ matrix.consumer_cxx }}' \
            --obs '${{ matrix.obs }}' --madobs-include "$PWD/.dependencies/MadObs/include" \
            --evidence package-evidence.json
          cat package-evidence.json
      - name: Save compiler and package evidence
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.direction }}-${{ matrix.obs }}
          path: package-evidence.json

name: Android curl runner capability observation
on:
  push:
    branches: [checkpoint/madmedia-android-curl-runner-preflight]
permissions:
  contents: read
jobs:
  observer:
    if: github.ref == 'refs/heads/checkpoint/madmedia-android-curl-runner-preflight'
    runs-on: ubuntu-22.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact source checkpoint
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Observe unchanged runner capabilities only
        shell: bash --noprofile --norc {0}
        run: |
          set -u
          status=0
          if [[ $(id -u) == 0 ]]; then
            echo 'FAIL: non-root runner required'
            exit 1
          fi
          echo 'PASS: non-root runner'
          if ! /usr/bin/grep -Fxq 'VERSION_ID="22.04"' /etc/os-release; then
            echo 'FAIL: unexpected runner OS version'
            exit 1
          fi
          echo 'PASS: Ubuntu 22.04 runner'

          if [[ -x /usr/bin/unshare ]] &&
             outside=$(/usr/bin/readlink /proc/self/ns/net 2>/dev/null) &&
             inside=$(/usr/bin/timeout 10 /usr/bin/unshare --user --map-root-user --net -- /usr/bin/readlink /proc/self/ns/net 2>/dev/null) &&
             [[ $outside =~ ^net:\[[0-9]+\]$ && $inside =~ ^net:\[[0-9]+\]$ && $inside != "$outside" ]]; then
            echo 'PASS: independent user and network namespace available'
          else
            echo 'FAIL: isolated user and network namespace unavailable'
            status=1
          fi

          ndk="${ANDROID_HOME:-}/ndk/28.2.13676358"
          if [[ -n ${ANDROID_HOME:-} && -r "$ndk/source.properties" &&
                -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]] &&
             grep -Eq '^Pkg.Revision[[:blank:]]*=[[:blank:]]*28\.2\.13676358[[:space:]]*$' "$ndk/source.properties" 2>/dev/null; then
            echo 'PASS: preinstalled NDK r28c receipt and compiler path'
          else
            echo 'FAIL: preinstalled NDK r28c receipt or compiler missing'
            status=1
          fi

          if cmake_path=$(type -P cmake) && [[ $cmake_path == /* && -x $cmake_path ]] &&
             cmake_version=$(/usr/bin/timeout 10 "$cmake_path" --version 2>/dev/null) &&
             [[ ${cmake_version%%$'\n'*} =~ ^cmake\ version\ [0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'PASS: runner CMake path and version available'
          else
            echo 'FAIL: runner CMake path or version unavailable'
            status=1
          fi
          if ninja_path=$(type -P ninja) && [[ $ninja_path == /* && -x $ninja_path ]] &&
             ninja_version=$(/usr/bin/timeout 10 "$ninja_path" --version 2>/dev/null) &&
             [[ $ninja_version =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo 'PASS: runner Ninja path and version available'
          else
            echo 'FAIL: runner Ninja path or version unavailable'
            status=1
          fi
          echo 'OBSERVATION ONLY: no dependency build, install, or Android runtime'
          exit "$status"

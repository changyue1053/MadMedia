name: Native development baseline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    # This exact push has its own stock-only, no-task installed ownership gate.
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/checkpoint/madmedia-installed-ownership' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libcurl4-openssl-dev libsqlite3-dev python3
      - name: Build standalone (no other Mad SDK)
        run: cmake -S . -B build -DMADMEDIA_BUILD_TOOLS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -D_FORTIFY_SOURCE=3" && cmake --build build -j4
      - name: Native tests
        run: ctest --test-dir build --output-on-failure
      - name: Installed consumer
        run: |
          cmake --install build --prefix "$PWD/stage"
          cmake -S examples/standalone -B consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build consumer -j4
          ./consumer/madmedia_consumer
